{
  "components": {
    "schemas": {
      "ActiveChange": {
        "properties": {
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "active"
        ],
        "type": "object"
      },
      "AuthenticatedUser": {
        "properties": {
          "account_type": {
            "enum": [
              "local",
              "directory"
            ],
            "type": "string"
          },
          "display_name": {
            "type": "string"
          },
          "is_super_admin": {
            "default": false,
            "type": "boolean"
          },
          "permissions": {
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "public_id": {
            "format": "uuid",
            "type": "string"
          },
          "role": {
            "anyOf": [
              {
                "enum": [
                  "inceleyici",
                  "kural-yoneticisi"
                ],
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "roles": {
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "tenant_id": {
            "format": "uuid",
            "type": "string"
          },
          "username": {
            "type": "string"
          }
        },
        "required": [
          "public_id",
          "username",
          "display_name",
          "tenant_id",
          "account_type"
        ],
        "type": "object"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array"
          }
        },
        "type": "object"
      },
      "LoginRequest": {
        "properties": {
          "password": {
            "format": "password",
            "maxLength": 128,
            "type": "string",
            "writeOnly": true
          },
          "username": {
            "maxLength": 320,
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "username",
          "password"
        ],
        "type": "object"
      },
      "LoginResponse": {
        "properties": {
          "access_token": {
            "type": "string"
          },
          "expires_in": {
            "description": "Access-token lifetime in seconds.",
            "type": "integer"
          },
          "token_type": {
            "const": "bearer",
            "default": "bearer",
            "type": "string"
          },
          "user": {
            "$ref": "#/components/schemas/AuthenticatedUser"
          }
        },
        "required": [
          "access_token",
          "expires_in",
          "user"
        ],
        "type": "object"
      },
      "RoleChange": {
        "properties": {
          "role": {
            "enum": [
              "inceleyici",
              "kural-yoneticisi"
            ],
            "type": "string"
          }
        },
        "required": [
          "role"
        ],
        "type": "object"
      },
      "UserPage": {
        "properties": {
          "items": {
            "items": {
              "$ref": "#/components/schemas/UserSummary"
            },
            "type": "array"
          },
          "page": {
            "type": "integer"
          },
          "size": {
            "type": "integer"
          },
          "total": {
            "type": "integer"
          }
        },
        "required": [
          "items",
          "page",
          "size",
          "total"
        ],
        "type": "object"
      },
      "UserSummary": {
        "properties": {
          "account_type": {
            "enum": [
              "local",
              "directory"
            ],
            "type": "string"
          },
          "display_name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "is_active": {
            "type": "boolean"
          },
          "is_super_admin": {
            "type": "boolean"
          },
          "last_login_at": {
            "anyOf": [
              {
                "format": "date-time",
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "public_id": {
            "format": "uuid",
            "type": "string"
          },
          "role": {
            "anyOf": [
              {
                "enum": [
                  "inceleyici",
                  "kural-yoneticisi"
                ],
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "username": {
            "type": "string"
          }
        },
        "required": [
          "public_id",
          "username",
          "display_name",
          "email",
          "account_type",
          "role",
          "is_super_admin",
          "is_active",
          "last_login_at"
        ],
        "type": "object"
      },
      "ValidationError": {
        "properties": {
          "ctx": {
            "type": "object"
          },
          "input": {},
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array"
          },
          "msg": {
            "type": "string"
          },
          "type": {
            "type": "string"
          }
        },
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "type": "object"
      }
    },
    "securitySchemes": {
      "HTTPBearer": {
        "scheme": "bearer",
        "type": "http"
      },
      "tenant": {
        "in": "header",
        "name": "x-tenant-id",
        "type": "apiKey"
      }
    }
  },
  "info": {
    "description": "Platform API for dwhcodereview",
    "title": "DWH Code Review",
    "version": "0.1.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/api/dwhcodereview/v1/admin/users": {
      "get": {
        "description": "List the tenant's users ordered by login name (UPN).",
        "parameters": [
          {
            "in": "query",
            "name": "page",
            "required": false,
            "schema": {
              "default": 1,
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "size",
            "required": false,
            "schema": {
              "default": 50,
              "maximum": 200,
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "q",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "maxLength": 200,
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UserPage"
                }
              }
            },
            "description": "Successful Response"
          },
          "400": {
            "description": "Ge\u00e7ersiz istek de\u011feri"
          },
          "401": {
            "description": "Oturum yok"
          },
          "403": {
            "description": "S\u00fcper y\u00f6netici de\u011fil"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "security": [
          {
            "HTTPBearer": [],
            "tenant": []
          }
        ],
        "summary": "List Users",
        "tags": [
          "user-administration"
        ]
      }
    },
    "/api/dwhcodereview/v1/admin/users/{public_id}/active": {
      "put": {
        "description": "Deactivate or reactivate an account; repeating the same value changes nothing.",
        "parameters": [
          {
            "in": "path",
            "name": "public_id",
            "required": true,
            "schema": {
              "format": "uuid",
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ActiveChange"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ActiveChange"
                }
              }
            },
            "description": "Successful Response"
          },
          "400": {
            "description": "Ge\u00e7ersiz istek de\u011feri"
          },
          "401": {
            "description": "Oturum yok"
          },
          "403": {
            "description": "S\u00fcper y\u00f6netici de\u011fil"
          },
          "404": {
            "description": "Kullan\u0131c\u0131 yok"
          },
          "409": {
            "description": "Kendi hesab\u0131 veya s\u00fcper y\u00f6netici"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "security": [
          {
            "HTTPBearer": [],
            "tenant": []
          }
        ],
        "summary": "Set Active",
        "tags": [
          "user-administration"
        ]
      }
    },
    "/api/dwhcodereview/v1/admin/users/{public_id}/role": {
      "put": {
        "description": "Assign 'inceleyici' or 'kural-yoneticisi'; repeating the same value changes nothing.",
        "parameters": [
          {
            "in": "path",
            "name": "public_id",
            "required": true,
            "schema": {
              "format": "uuid",
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RoleChange"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RoleChange"
                }
              }
            },
            "description": "Successful Response"
          },
          "400": {
            "description": "Ge\u00e7ersiz istek de\u011feri"
          },
          "401": {
            "description": "Oturum yok"
          },
          "403": {
            "description": "S\u00fcper y\u00f6netici de\u011fil"
          },
          "404": {
            "description": "Kullan\u0131c\u0131 yok"
          },
          "409": {
            "description": "S\u00fcper y\u00f6netici"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "security": [
          {
            "HTTPBearer": [],
            "tenant": []
          }
        ],
        "summary": "Set Role",
        "tags": [
          "user-administration"
        ]
      }
    },
    "/api/dwhcodereview/v1/auth/login": {
      "post": {
        "description": "Authenticate a local or directory account; issue an access token and a refresh cookie.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            },
            "description": "Successful Response"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "summary": "Login",
        "tags": [
          "authentication"
        ]
      }
    },
    "/api/dwhcodereview/v1/auth/logout": {
      "post": {
        "description": "End the refresh session on the server and delete the cookie; works without a token.",
        "parameters": [
          {
            "in": "cookie",
            "name": "dwhcodereview_refresh",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ]
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Successful Response"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "summary": "Logout",
        "tags": [
          "authentication"
        ]
      }
    },
    "/api/dwhcodereview/v1/auth/me": {
      "get": {
        "description": "Return the active user, display name, current role and account type.",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthenticatedUser"
                }
              }
            },
            "description": "Successful Response"
          }
        },
        "security": [
          {
            "HTTPBearer": [],
            "tenant": []
          }
        ],
        "summary": "Me",
        "tags": [
          "authentication"
        ]
      }
    },
    "/api/dwhcodereview/v1/auth/refresh": {
      "post": {
        "description": "Rotate the refresh cookie and return a new access token with the current role.",
        "parameters": [
          {
            "in": "cookie",
            "name": "dwhcodereview_refresh",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            },
            "description": "Successful Response"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "summary": "Refresh",
        "tags": [
          "authentication"
        ]
      }
    },
    "/api/dwhcodereview/v1/liveness": {
      "get": {
        "description": "The process can serve requests.",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": {
                    "type": "string"
                  },
                  "type": "object"
                }
              }
            },
            "description": "Successful Response"
          }
        },
        "summary": "Liveness",
        "tags": [
          "health"
        ]
      }
    },
    "/api/dwhcodereview/v1/readiness": {
      "get": {
        "description": "Return 503 until PostgreSQL accepts a trivial query.",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {}
              }
            },
            "description": "Successful Response"
          }
        },
        "summary": "Readiness",
        "tags": [
          "health"
        ]
      }
    }
  }
}
