apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "generated.resourceName" (list . "frontend") }}
  labels:
    {{- include "generated.workloadLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  annotations:
    {{- include "generated.annotations" . | nindent 4 }}
data:
  nginx.conf: |
    {{- include "dwhcodereview.frontendNginxMainConfig" . | nindent 4 }}
  default.conf: |
    {{- include "dwhcodereview.frontendNginxConfig" . | nindent 4 }}
