name: dwhcodereview

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317}
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?start the stack through scripts/stack.sh}
      POSTGRES_DB: dwhcodereview_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dwhcodereview_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Cache slot: starts only when an accepted PRD enables the `cache` profile.
  redis:
    profiles: ["cache"]
    image: ${REDIS_IMAGE:-redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2}
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck sends no password on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?start the stack through scripts/stack.sh}
    # The password reaches the server as configuration on standard input, never as a process
    # argument; the image entrypoint still drops to the unprivileged redis user.
    entrypoint:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - --save "" --appendonly no <<EOF
        requirepass $$REDISCLI_AUTH
        EOF
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile.dev
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.13-alpine3.23@sha256:7ea3f82de8ea6d4fb7e5d2bbe3fe3c9d931700b7a529f1fe5769e42abe514ca1}
        DEPENDENCY_MODE: ${DEPENDENCY_MODE:-connected}
      additional_contexts:
        python_wheelhouse: ${PYTHON_WHEELHOUSE_CONTEXT:-../frontend}
        system_packages: ${SYSTEM_PACKAGES_CONTEXT:-../frontend}
    environment:
      DWHCODEREVIEW_ENVIRONMENT: development
      DWHCODEREVIEW_DEBUG: "true"
      DWHCODEREVIEW_LOG_LEVEL: INFO
      DWHCODEREVIEW_PROJECT_NAME: "DWH Code Review"
      DWHCODEREVIEW_API_PREFIX: "/api/dwhcodereview/v1"
      DWHCODEREVIEW_TENANT_HEADER: "x-tenant-id"
      DWHCODEREVIEW_CORS_ALLOW_ORIGINS: "http://localhost:3000,http://localhost:8080"
      DWHCODEREVIEW_DATABASE_URL: "postgresql+asyncpg://app:${POSTGRES_PASSWORD:?start the stack through scripts/stack.sh}@postgres:5432/dwhcodereview_db"
      DWHCODEREVIEW_JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?start the stack through scripts/stack.sh}"
      DWHCODEREVIEW_JWT_ALGORITHM: ES256
      DWHCODEREVIEW_JWT_ISSUER: "dwhcodereview"
      DWHCODEREVIEW_JWT_AUDIENCE: "dwhcodereview-api"
      DWHCODEREVIEW_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      DWHCODEREVIEW_REFRESH_SESSION_IDLE_MINUTES: "60"
      DWHCODEREVIEW_REFRESH_SESSION_ABSOLUTE_HOURS: "8"
      DWHCODEREVIEW_LOCAL_LOGIN_SUPER_ADMIN_ONLY_ENFORCED: "false"
      DWHCODEREVIEW_PUBLIC_ORIGIN: "http://localhost:${APP_HTTP_PORT:-8080}"
      DWHCODEREVIEW_TRUSTED_PROXY_CIDRS: ""
      # Local development has no Active Directory; scripts/create-local-user.sh creates test users.
      DWHCODEREVIEW_DIRECTORY_ENABLED: "false"
      DWHCODEREVIEW_DIRECTORY_HOST: ""
      DWHCODEREVIEW_DIRECTORY_PORT: "636"
      DWHCODEREVIEW_DIRECTORY_BASE_DN: ""
      DWHCODEREVIEW_DIRECTORY_UPN_SUFFIX: ""
      DWHCODEREVIEW_DIRECTORY_CA_BUNDLE_PATH: ""
      DWHCODEREVIEW_DIRECTORY_TLS_LEGACY_COMPATIBILITY: "false"
      DWHCODEREVIEW_DIRECTORY_CONNECT_TIMEOUT_SECONDS: "5"
      DWHCODEREVIEW_DIRECTORY_READ_TIMEOUT_SECONDS: "10"
      # The default local network has no egress; SQL Server and LLM values stay empty unless the
      # developer supplies them from the shell or the Git-ignored app/infra/.env. The backend
      # reaches a SQL Server or LLM on this computer only through the opt-in local-egress gate
      # below, as host.docker.internal. A developer SQL Server with a self-signed certificate needs
      # DWHCODEREVIEW_MSSQL_TRUST_SERVER_CERTIFICATE=true there; outside the development
      # environment the backend refuses to start with it.
      DWHCODEREVIEW_MSSQL_SERVER: "${DWHCODEREVIEW_MSSQL_SERVER:-}"
      DWHCODEREVIEW_MSSQL_PORT: "${DWHCODEREVIEW_MSSQL_PORT:-1433}"
      DWHCODEREVIEW_MSSQL_USER: "${DWHCODEREVIEW_MSSQL_USER:-}"
      DWHCODEREVIEW_MSSQL_PASSWORD: "${DWHCODEREVIEW_MSSQL_PASSWORD:-}"
      DWHCODEREVIEW_MSSQL_ENCRYPT: "${DWHCODEREVIEW_MSSQL_ENCRYPT:-true}"
      DWHCODEREVIEW_MSSQL_TRUST_SERVER_CERTIFICATE: "${DWHCODEREVIEW_MSSQL_TRUST_SERVER_CERTIFICATE:-false}"
      DWHCODEREVIEW_MSSQL_ALLOWED_DATABASES: "${DWHCODEREVIEW_MSSQL_ALLOWED_DATABASES:-}"
      DWHCODEREVIEW_MSSQL_LOGIN_TIMEOUT_SECONDS: "15"
      DWHCODEREVIEW_MSSQL_QUERY_TIMEOUT_SECONDS: "60"
      DWHCODEREVIEW_MSSQL_MAX_CONCURRENCY: "4"
      DWHCODEREVIEW_LLM_CHAT_API: "${DWHCODEREVIEW_LLM_CHAT_API:-api_v1_chat}"
      DWHCODEREVIEW_LLM_BASE_URL: "${DWHCODEREVIEW_LLM_BASE_URL:-}"
      DWHCODEREVIEW_LLM_CHAT_URL: "${DWHCODEREVIEW_LLM_CHAT_URL:-}"
      DWHCODEREVIEW_LLM_MODEL: "${DWHCODEREVIEW_LLM_MODEL:-}"
      DWHCODEREVIEW_LLM_API_KEY: "${DWHCODEREVIEW_LLM_API_KEY:-}"
      DWHCODEREVIEW_LLM_CA_BUNDLE: ""
      DWHCODEREVIEW_LLM_READ_TIMEOUT_SECONDS: "900"
      DWHCODEREVIEW_LLM_REQUEST_RETRIES: "2"
      DWHCODEREVIEW_LLM_MAX_CONCURRENT_CALLS: "6"
      DWHCODEREVIEW_LLM_PROCESS_MAX_CONCURRENT_CALLS: "12"
      DWHCODEREVIEW_LLM_USER_AGENT: "DWHCodeReview-Backend/1.0 (internal SQL review; httpx)"
      DWHCODEREVIEW_REVIEW_MAX_SQL_CHARS: "120000"
      DWHCODEREVIEW_REVIEW_TWO_PART_THRESHOLD_CHARS: "45000"
      DWHCODEREVIEW_REVIEW_RATE_LIMIT_WINDOW_SECONDS: "60"
      DWHCODEREVIEW_REVIEW_RATE_LIMIT_MAX_REQUESTS: "30"
      DWHCODEREVIEW_REVIEW_HISTORY_RETENTION_DAYS: "90"
      # OpenTelemetry export stays off here; the observability overlay sets its collector address.
      DWHCODEREVIEW_OTEL_EXPORTER_OTLP_ENDPOINT: "${DWHCODEREVIEW_OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      DWHCODEREVIEW_OTEL_SERVICE_NAME: "dwhcodereview-backend"
      DWHCODEREVIEW_OTEL_TRACES_SAMPLE_RATIO: "1.0"
      DWHCODEREVIEW_OTEL_METRIC_EXPORT_INTERVAL_SECONDS: "15"
    volumes:
      - ../backend:/workspace/app/backend
      - ../../schema:/workspace/schema
      - ../../specs:/workspace/specs
    networks:
      - default
      - host-gate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in local egress (specs/application-foundation/PRDs/002-kubernetes-delivery Requirement 11,
  # Decision 15): starts only when app/infra/.env sets COMPOSE_PROFILES=local-egress. The gate is
  # host.docker.internal for the backend alone and forwards only SQL Server (1433), Ollama (11434)
  # and LM Studio (1234) on this computer; the backend itself stays on internal networks. Without
  # the profile the name does not resolve and nothing leaves the stack.
  local-egress:
    profiles: ["local-egress"]
    image: ${NGINX_IMAGE:-nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752}
    # Docker maps host.docker.internal to an IPv4 and an IPv6 address of this computer, but the
    # egress bridge has no IPv6 route; the gate forwards to the IPv4 address only.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        address="$$(awk '$$2 == "host.docker.internal" && $$1 !~ /:/ { print $$1; exit }' /etc/hosts)"
        test -n "$$address" || { echo "local-egress: host.docker.internal has no IPv4 address" >&2; exit 1; }
        sed "s/host\.docker\.internal:/$$address:/" /etc/nginx/local-egress.conf > /tmp/local-egress.conf
        exec nginx -c /tmp/local-egress.conf -g "daemon off;"
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - ./nginx/nginx.local-egress.conf:/etc/nginx/local-egress.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 127.0.0.1
    networks:
      host-gate:
        aliases:
          - host.docker.internal
      egress: {}
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
      args:
        FRONTEND_NODE_BASE_IMAGE: ${FRONTEND_NODE_BASE_IMAGE:-node:22.23.2-alpine3.23@sha256:46825fbbd4e996a78b7a2cdc08d75e38a5a505bdab95dcda55605359bf124bc6}
        DEPENDENCY_MODE: ${DEPENDENCY_MODE:-connected}
      additional_contexts:
        npm_cache: ${NPM_CACHE_CONTEXT:-.}
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/components.json:/app/components.json:ro
      - ../frontend/eslint.config.js:/app/eslint.config.js:ro
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/package.json:/app/package.json:ro
      - ../frontend/package-lock.json:/app/package-lock.json:ro
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ../frontend/tsconfig.json:/app/tsconfig.json:ro
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ../frontend/vite.config.ts:/app/vite.config.ts:ro
      - ../frontend/vitest.config.ts:/app/vitest.config.ts:ro
      - frontend_dependencies:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752}
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:8080"
    networks:
      - default
      - edge
    dns:
      - 127.0.0.1
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_dependencies:

networks:
  default:
    internal: true
  # Docker Desktop does not publish ports from an internal-only bridge. Only the
  # reverse proxy joins this host-facing bridge; application and data services do not.
  edge:
    driver: bridge
  # Only the backend and the opt-in local-egress gate join this network.
  host-gate:
    internal: true
  # Only the local-egress gate joins this outbound bridge; it exists only with the profile.
  egress:
    driver: bridge
