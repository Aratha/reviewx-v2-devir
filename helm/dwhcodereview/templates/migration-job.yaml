{{- if .Values.migration.enabled -}}
{{- include "generated.validateMigration" . -}}
{{- $migration := .Values.migration -}}
{{- $secret := required "migration.existingSecret must name a pre-created Secret" $migration.existingSecret -}}
{{- $mode := include "generated.migrationMode" . -}}
{{- $image := include "generated.image" (list "backend" .Values.backend.image) -}}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if eq $mode "upgrade" }}
  name: {{ include "generated.resourceName" (list . "migration") }}
  {{- else }}
  name: {{ include "generated.resourceName" (list . "migration-init") }}
  {{- end }}
  labels:
    {{- include "generated.workloadLabels" (dict "root" . "component" "migration") | nindent 4 }}
  annotations:
    {{- include "generated.annotations" . | nindent 4 }}
    {{- if eq $mode "upgrade" }}
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    # The last run stays for inspection until the next deployment replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
spec:
  # A failed migration is inspected, never retried.
  backoffLimit: 0
  activeDeadlineSeconds: {{ $migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "generated.workloadLabels" (dict "root" . "component" "migration") | nindent 8 }}
      annotations:
        {{- include "generated.annotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The database Service accepts a connection only after its SELECT 1 readiness probe passes.
        - name: wait-for-database
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import socket
              import time

              while True:
                  try:
                      socket.create_connection(({{ include "generated.resourceName" (list . "database") | quote }}, {{ int .Values.postgres.port }}), timeout=3).close()
                      break
                  except OSError:
                      print("waiting for the database", flush=True)
                      time.sleep(3)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $migration.resources | nindent 12 }}
      containers:
        - name: migration
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: {name: {{ $secret | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml $migration.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- end }}
