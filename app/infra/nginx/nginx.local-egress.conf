# Local egress gate of the `local-egress` Compose profile
# (specs/application-foundation/PRDs/002-kubernetes-delivery Requirement 11, Decision 15).
#
# The backend reaches this gate as host.docker.internal on the internal host-gate network. The gate
# forwards only the ports below to the developer's own computer; every other port and every other
# destination stays closed. Compose maps host.docker.internal to this computer in the gate's
# /etc/hosts, and the gate's entrypoint replaces the name below with that IPv4 address.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr notice;

events {
  worker_connections 256;
}

stream {
  proxy_connect_timeout 10s;
  # Longer than the backend's longest LLM read timeout (DWHCODEREVIEW_LLM_READ_TIMEOUT_SECONDS,
  # at most 3600), so a slow, non-streaming model answer is not cut by the gate.
  proxy_timeout 65m;

  # SQL Server on this computer, e.g. a local container that publishes port 1433.
  server {
    listen 1433;
    proxy_pass host.docker.internal:1433;
  }

  # Ollama's OpenAI-compatible API.
  server {
    listen 11434;
    proxy_pass host.docker.internal:11434;
  }

  # LM Studio's API.
  server {
    listen 1234;
    proxy_pass host.docker.internal:1234;
  }
}
