{{- if .Values.frontend.nginxConfig.override }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dwhcodereview.frontend.fullname" . }}-nginx
  labels:
    {{- include "dwhcodereview.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # frontend/nginx.conf'un Kubernetes karsiligi: proxy_pass hedefi backend
  # Service'inin cluster ici DNS adiyla render edilir.
  default.conf: |
    server {
        listen {{ .Values.frontend.containerPort }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA: client-side route
        location / {
            try_files $uri $uri/ /index.html;
        }

        # FastAPI - SSE streaming icin buffering kapali
        location /api {
            proxy_pass http://{{ include "dwhcodereview.backend.fullname" . }}:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout {{ .Values.frontend.nginxConfig.proxyReadTimeout }}s;
            proxy_send_timeout {{ .Values.frontend.nginxConfig.proxySendTimeout }}s;
        }
    }
{{- end }}
