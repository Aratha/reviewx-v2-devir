            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "security": [
          {
            "HTTPBearer": [],
            "tenant": []
          }
        ],
        "summary": "List Users",
        "tags": [
          "user-administration"
        ]
      }
    },
