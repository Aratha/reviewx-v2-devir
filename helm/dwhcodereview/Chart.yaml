annotations:
  catalog.cattle.io/display-name: "DWH Code Review"
  catalog.cattle.io/release-name: dwhcodereview
  catalog.cattle.io/namespace: dwhcodereview
  catalog.cattle.io/kube-version: ">=1.23.0-0"
maintainers:
