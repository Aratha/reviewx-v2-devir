{{/*
  Secret kaynagi dogrulamasi. Bu blok secrets.create degerinden bagimsiz
  calisir; harici Secret kipinde de yanlis yapilandirmayi install aninda
  durdurur (aksi halde backend Pod'u var olmayan Secret'a envFrom yapar).
*/}}
{{- $secrets := .Values.secrets | default dict }}
{{- if not (hasKey $secrets "create") }}
{{- fail "secrets.create tanimli olmali (true: chart Secret uretir, false: secrets.existingSecret zorunlu)" }}
{{- end }}
{{- if not (kindIs "bool" $secrets.create) }}
{{- fail "secrets.create bool olmali (true veya false)" }}
{{- end }}
{{- $existingSecret := $secrets.existingSecret | default "" | trim }}
{{- if and $secrets.create $existingSecret }}
{{- fail "secrets.create=true ile secrets.existingSecret birlikte kullanilamaz; tek Secret kaynagi secin (chart uretsin: create=true + existingSecret bos, harici Secret: create=false + existingSecret dolu)" }}
{{- end }}
{{- if and (not $secrets.create) (not $existingSecret) }}
{{- fail "secrets.create=false iken secrets.existingSecret zorunlu; harici Secret adini verin (anahtarlari templates/secret.yaml ile birebir ayni olmali)" }}
{{- end }}
{{- if $secrets.create }}
{{- $cfg := .Values.appConfig | default dict }}
{{/*
  Bos bir `--set-string appConfig.X=` degeri, -f ile verilen dosyalardan DAHA
  YUKSEK oncelikli oldugu icin dosyadaki gecerli degeri siler. Bu, CI sirlari
  script'e aktarilmadiginda olur (ornek: Azure DevOps secret degiskenleri
  task'in env: blogunda tanimli degilse bos gelir) ve asagidaki guard'lari
  yanlis yere tetikler. Boyle bir durumda appConfigFallback devreye girer.

  Rancher UI yalnizca chart kokundeki values.yaml'i yukler; orada fallback
  BOSTUR, dolayisiyla UI'dan bos deger girildiginde guard'lar aynen calisir.
*/}}
{{- $fb := .Values.appConfigFallback | default dict }}
{{- $mssql := $cfg.mssqlConnectionString | default "" }}
{{- if not (trim $mssql) }}{{- $mssql = $fb.mssqlConnectionString | default "" }}{{- end }}
{{- $accessToken := $cfg.apiAccessToken | default "" }}
{{- if not (trim $accessToken) }}{{- $accessToken = $fb.apiAccessToken | default "" }}{{- end }}
{{- $adminToken := $cfg.apiAdminToken | default "" }}
{{- if not (trim $adminToken) }}{{- $adminToken = $fb.apiAdminToken | default "" }}{{- end }}
{{- $_ := required "appConfig.mssqlConnectionString bos olamaz. Rancher UI'da 'SQL Server baglanti dizesi' alanini doldurun; CLI'da --set-string appConfig.mssqlConnectionString='DRIVER={ODBC Driver 18 for SQL Server};SERVER=...' verin." $mssql }}
{{- $_ := required "appConfig.apiAccessToken bos olamaz, en az 16 karakter olmali. Rancher UI'da 'API erisim tokeni' alanini doldurun; CLI'da --set-string appConfig.apiAccessToken=... verin." $accessToken }}
{{- if lt (len (trim $accessToken)) 16 }}
{{- fail "appConfig.apiAccessToken en az 16 karakter olmali (Rancher UI'da 'API erisim tokeni' alani)" }}
{{- end }}
{{- if and $adminToken (lt (len (trim $adminToken)) 16) }}
{{- fail "appConfig.apiAdminToken doluysa en az 16 karakter olmali (Rancher UI'da 'API yonetim tokeni' alani)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dwhcodereview.secretName" . }}
  labels:
    {{- include "dwhcodereview.labels" . | nindent 4 }}
type: Opaque
stringData:
  # backend/config.py (pydantic Settings) alanlarinin env karsiliklari.
  MSSQL_CONNECTION_STRING: {{ $mssql | quote }}
  LLM_BASE_URL: {{ $cfg.llmBaseUrl | quote }}
  LLM_CHAT_API: {{ $cfg.llmChatApi | quote }}
  LLM_CHAT_URL: {{ $cfg.llmChatUrl | quote }}
  LLM_MODEL: {{ $cfg.llmModel | quote }}
  SQL_REVIEW_LLM_MODEL: {{ $cfg.sqlReviewLlmModel | quote }}
  LLM_API_KEY: {{ $cfg.llmApiKey | quote }}
  LLM_HTTP_TRUST_ENV: {{ $cfg.llmHttpTrustEnv | quote }}
  LLM_HTTP_USER_AGENT: {{ $cfg.llmHttpUserAgent | quote }}
  LLM_ENFORCE_PRIVATE_NETWORK: {{ $cfg.llmEnforcePrivateNetwork | quote }}
  LLM_ALLOW_PUBLIC_HOSTS: {{ $cfg.llmAllowPublicHosts | quote }}
  LLM_LOG_FULL_PAYLOADS: {{ $cfg.llmLogFullPayloads | quote }}
  SQL_REVIEW_MAX_CONCURRENT_RULES: {{ $cfg.sqlReviewMaxConcurrentRules | quote }}
  LLM_READ_TIMEOUT_SECONDS: {{ $cfg.llmReadTimeoutSeconds | quote }}
  LLM_REQUEST_RETRIES: {{ $cfg.llmRequestRetries | quote }}
  SQL_REVIEW_TWO_PART_THRESHOLD_CHARS: {{ $cfg.sqlReviewTwoPartThresholdChars | quote }}
  CORS_ORIGINS: {{ $cfg.corsOrigins | quote }}
  API_ACCESS_TOKEN: {{ $accessToken | quote }}
  API_ADMIN_TOKEN: {{ $adminToken | quote }}
  API_RATE_LIMIT_ENABLED: {{ $cfg.apiRateLimitEnabled | quote }}
  API_RATE_LIMIT_WINDOW_SECONDS: {{ $cfg.apiRateLimitWindowSeconds | quote }}
  API_RATE_LIMIT_REVIEW_MAX: {{ $cfg.apiRateLimitReviewMax | quote }}
{{- end }}
