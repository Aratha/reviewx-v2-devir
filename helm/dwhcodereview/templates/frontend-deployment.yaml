{{- $image := include "generated.image" (list "frontend" .Values.frontend.image) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generated.resourceName" (list . "frontend") }}
  labels:
    {{- include "generated.workloadLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  annotations:
    {{- include "generated.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      scaffold.kt.internal/workload: {{ include "generated.resourceName" (list . "frontend") | quote }}
  template:
    metadata:
      labels:
        {{- include "generated.workloadLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      annotations:
        {{- include "generated.annotations" . | nindent 8 }}
        checksum/nginx-config: {{ printf "%s\n%s" (include "dwhcodereview.frontendNginxMainConfig" .) (include "dwhcodereview.frontendNginxConfig" .) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: {{ $image | quote }}
          imagePullPolicy: {{ include "dwhcodereview.imagePullPolicy" .Values.frontend.image }}
          # İmajın root varsayan entrypoint betikleri atlanır; Nginx doğrudan başlar.
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "generated.resourceName" (list . "frontend") | quote }}
        - name: cache
          emptyDir: {sizeLimit: 64Mi}
        - name: run
          emptyDir: {sizeLimit: 8Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
