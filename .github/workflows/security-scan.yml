name: security-scan
on:
  pull_request:
permissions:
  contents: read
env:
  SEMGREP_ENABLE_VERSION_CHECK: "0"
  SEMGREP_SEND_METRICS: "off"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_SKIP_DB_UPDATE: "true"
  TRIVY_SKIP_JAVA_DB_UPDATE: "true"
  INTERNAL_SCANNER_MATERIAL_DIR: ${{ vars.INTERNAL_SCANNER_MATERIAL_DIR }}
  INTERNAL_SCANNER_SHA256SUMS: ${{ vars.INTERNAL_SCANNER_SHA256SUMS }}
  INTERNAL_SCANNER_SHA256SUMS_SHA256: ${{ vars.INTERNAL_SCANNER_SHA256SUMS_SHA256 }}
  INTERNAL_SCANNER_ADMITTED_ON: ${{ vars.INTERNAL_SCANNER_ADMITTED_ON }}
  INTERNAL_SCANNER_MAX_AGE_DAYS: "7"
  INTERNAL_SEMGREP_RULESET: ${{ vars.INTERNAL_SEMGREP_RULESET }}
  TRIVY_CACHE_DIR: ${{ vars.TRIVY_CACHE_DIR }}
jobs:
  scan:
    runs-on: [self-hosted, linux, bank-offline]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify admitted dependency and scanner evidence
        run: scripts/security-gate.sh
