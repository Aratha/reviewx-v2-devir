# TEST ortami override'lari

backend:
  replicaCount: 1
  image:
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicaCount: 1
  image:
    tag: latest
    pullPolicy: Always

persistence:
  enabled: true
  size: 5Gi

ingress:
  enabled: true
  host: dwhcodereview.ailabtest.kuveytturk.com.tr
  tls:
    enabled: false          # test: dummy sertifika opsiyonel
    secretName: dwhcodereview-tls

secrets:
  create: true

appConfig:
  # TODO: gercek SQL Server saglandiginda guncelleyin (henuz test DB'si tahsis edilmedi).
  mssqlConnectionString: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=TBD-DB-NOT-PROVISIONED;DATABASE=master;UID=tbd;PWD=tbd;TrustServerCertificate=yes"

  llmBaseUrl: "http://llm-gateway.ailabtest.svc.cluster.local/v1"
  llmChatApi: "api_v1_chat"
  llmModel: "openai/gpt-oss-120b"
  llmEnforcePrivateNetwork: true
  llmLogFullPayloads: false

  # ingress.tls.enabled=false ile uyumlu (http)
  corsOrigins: "http://dwhcodereview.ailabtest.kuveytturk.com.tr"

  # Test ortami icin sabit tokenlar (>=16 karakter zorunlu).
  apiAccessToken: "test-Kq7VnZ2sXbLmT4Rd"
  apiAdminToken: "test-Admin-9PwYcH3JeUxA"

  apiRateLimitEnabled: true
  apiRateLimitReviewMax: 60

imagePullSecrets:
  - name: ghcr-creds
