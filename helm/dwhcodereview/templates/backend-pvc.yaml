{{- if .Values.backend.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dwhcodereview.dataClaimName" . }}
  labels:
    {{- include "generated.workloadLabels" (dict "root" . "component" "backend") | nindent 4 }}
  annotations:
    {{- include "generated.annotations" . | nindent 4 }}
    # Kurallar ve LLM logları release kaldırılsa da silinmez.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.backend.persistence.accessMode | quote }}]
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size | quote }}
  {{- with .Values.backend.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
