# ============================================================================
# Rancher Apps & Marketplace form tanimi.
#
# Rancher, chart'i kurarken YALNIZCA chart kokundeki values.yaml'i yukler;
# values-test.yaml / values-prod.yaml OTOMATIK UYGULANMAZ. Zorunlu degerler
# (mssqlConnectionString, apiAccessToken) values.yaml'da bilerek bos oldugu
# icin, bu dosya olmadan kullanici degerleri giremez ve install
# templates/secret.yaml guard'inda durur.
#
# Buradaki her `variable` values.yaml icindeki bir yol ile birebir eslesmelidir.
# ============================================================================

questions:

  # ---------------------------------------------------------------------
  # Zorunlu ayarlar
  # ---------------------------------------------------------------------
  - variable: secrets.create
    label: "Secret'i chart uretsin"
    description: >-
      Acik: baglanti dizesi ve tokenlar asagidaki alanlardan alinip chart
      tarafindan Secret olarak olusturulur. Kapali: kumede onceden olusturulmus
      harici bir Secret kullanilir (prod icin onerilir).
    type: boolean
    default: true
    required: true
    group: "Zorunlu Ayarlar"

  - variable: secrets.existingSecret
    label: "Harici Secret adi"
    description: >-
      Kullanilacak mevcut Secret'in adi. Anahtarlari templates/secret.yaml ile
      birebir ayni olmali (MSSQL_CONNECTION_STRING, API_ACCESS_TOKEN, LLM_* ...).
      Secret'i chart uretecekse bos birakin.
    type: string
    default: ""
    show_if: "secrets.create=false"
    required: true
    group: "Zorunlu Ayarlar"

  - variable: appConfig.mssqlConnectionString
    label: "SQL Server baglanti dizesi"
    description: >-
      ODBC Driver 18 baglanti dizesi. Ornek:
      DRIVER={ODBC Driver 18 for SQL Server};SERVER=dwh-sql;DATABASE=master;UID=svc_dwh;PWD=...;TrustServerCertificate=yes
    type: password
    default: ""
    show_if: "secrets.create=true"
    required: true
    group: "Zorunlu Ayarlar"

  - variable: appConfig.apiAccessToken
    label: "API erisim tokeni"
    description: >-
      /api uclarini koruyan token. En az 16 karakter olmali. Bos birakilamaz;
      aksi halde uclar kimlik dogrulamasiz kalir.
    type: password
    default: ""
    show_if: "secrets.create=true"
    required: true
    group: "Zorunlu Ayarlar"

  - variable: appConfig.apiAdminToken
    label: "API yonetim tokeni"
    description: >-
      Yonetim uclari (rules / llm-config / llm-logs) icin ayri token.
      Doluysa en az 16 karakter olmali. Onerilir.
    type: password
    default: ""
    show_if: "secrets.create=true"
    required: false
    group: "Zorunlu Ayarlar"

  # ---------------------------------------------------------------------
  # Ag / Ingress
  # ---------------------------------------------------------------------
  - variable: ingress.enabled
    label: "Ingress olustur"
    type: boolean
    default: true
    group: "Ag / Ingress"

  - variable: ingress.host
    label: "Ingress host"
    description: "Uygulamanin disaridan erisilecegi tek kanonik host adi."
    type: hostname
    default: "dwhcodereview.ailabtest.kuveytturk.com.tr"
    show_if: "ingress.enabled=true"
    required: true
    group: "Ag / Ingress"

  - variable: ingress.className
    label: "IngressClass"
    description: "Bos birakilirsa kumedeki varsayilan IngressClass kullanilir."
    type: string
    default: ""
    show_if: "ingress.enabled=true"
    group: "Ag / Ingress"

  - variable: ingress.tls.enabled
    label: "TLS (HTTPS) etkin"
    type: boolean
    default: false
    show_if: "ingress.enabled=true"
    group: "Ag / Ingress"

  - variable: ingress.tls.secretName
    label: "TLS Secret adi"
    type: string
    default: "dwhcodereview-tls"
    show_if: "ingress.enabled=true&&ingress.tls.enabled=true"
    group: "Ag / Ingress"

  - variable: appConfig.corsOrigins
    label: "CORS origin listesi"
    description: >-
      Ingress host ve TLS ayari ile uyumlu olmali. TLS kapaliysa http://,
      acikken https:// kullanin.
    type: string
    default: "https://dwhcodereview.ailabtest.kuveytturk.com.tr"
    show_if: "secrets.create=true"
    group: "Ag / Ingress"

  # ---------------------------------------------------------------------
  # LLM baglantisi
  # ---------------------------------------------------------------------
  - variable: appConfig.llmBaseUrl
    label: "LLM base URL"
    description: "Kume ici LLM gateway adresi."
    type: string
    default: "http://llm-gateway.ailab.svc.cluster.local/v1"
    show_if: "secrets.create=true"
    group: "LLM"

  - variable: appConfig.llmChatApi
    label: "LLM chat API tipi"
    type: enum
    options:
      - openai
      - api_v1_chat
    default: "api_v1_chat"
    show_if: "secrets.create=true"
    group: "LLM"

  - variable: appConfig.llmModel
    label: "LLM modeli"
    type: string
    default: "openai/gpt-oss-120b"
    show_if: "secrets.create=true"
    group: "LLM"

  - variable: appConfig.llmApiKey
    label: "LLM API anahtari"
    description: "Gateway anahtar istemiyorsa bos birakin."
    type: password
    default: ""
    show_if: "secrets.create=true"
    group: "LLM"

  - variable: appConfig.llmEnforcePrivateNetwork
    label: "LLM hedefi private agda olmali"
    description: "Kurumsal guvenlik gerekliligi. Kapatmayin."
    type: boolean
    default: true
    show_if: "secrets.create=true"
    group: "LLM"

  - variable: appConfig.llmReadTimeoutSeconds
    label: "LLM okuma zaman asimi (sn)"
    type: int
    default: 900
    show_if: "secrets.create=true"
    group: "LLM"

  # ---------------------------------------------------------------------
  # Imajlar
  # ---------------------------------------------------------------------
  - variable: backend.image.tag
    label: "Backend imaj etiketi"
    type: string
    default: "latest"
    group: "Imajlar"

  - variable: frontend.image.tag
    label: "Frontend imaj etiketi"
    type: string
    default: "latest"
    group: "Imajlar"

  - variable: imagePullSecrets[0].name
    label: "Image pull secret adi"
    description: "Private registry icin. Gerekmiyorsa bos birakin."
    type: string
    default: "ghcr-creds"
    group: "Imajlar"

  # ---------------------------------------------------------------------
  # Depolama ve olcek
  # ---------------------------------------------------------------------
  - variable: persistence.enabled
    label: "Kalici depolama (backend /app/data)"
    description: "review_rules.json ve LLM loglari icin PVC olusturur."
    type: boolean
    default: true
    group: "Depolama"

  - variable: persistence.size
    label: "PVC boyutu"
    type: string
    default: "5Gi"
    show_if: "persistence.enabled=true"
    group: "Depolama"

  - variable: persistence.storageClass
    label: "StorageClass"
    description: "Bos birakilirsa kumedeki varsayilan StorageClass kullanilir."
    type: storageclass
    default: ""
    show_if: "persistence.enabled=true"
    group: "Depolama"

  - variable: backend.replicaCount
    label: "Backend replika sayisi"
    type: int
    default: 1
    group: "Depolama"

  - variable: frontend.replicaCount
    label: "Frontend replika sayisi"
    type: int
    default: 1
    group: "Depolama"
